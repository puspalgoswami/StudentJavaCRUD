<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Record Management</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 850px;
      margin: 30px auto;
      padding: 0 16px;
      background: #f4f6fb;
      color: #222
    }

    h1 {
      color: #174ea6
    }

    .card {
      background: white;
      padding: 18px;
      margin: 18px 0;
      border-radius: 8px;
      box-shadow: 0 1px 5px #ddd
    }

    input {
      padding: 10px;
      margin: 5px;
      width: 26%;
      max-width: 190px
    }

    button {
      padding: 10px 14px;
      margin: 5px;
      border: 0;
      border-radius: 4px;
      background: #174ea6;
      color: white;
      cursor: pointer
    }

    button.delete {
      background: #c62828
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white
    }

    th,
    td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: left
    }

    th {
      background: #e8eefb
    }

    @media(max-width:650px) {
      input {
        width: 90%;
        max-width: none
      }
    }
  </style>
</head>

<body>
  <h1>Student Record Management</h1>
  <div class="card">
    <h2 id="formTitle">Add Student</h2>
    <form id="studentForm">
      <input type="hidden" id="id">
      <input id="name" placeholder="Student name" required>
      <input id="email" type="email" placeholder="Email" required>
      <input id="course" placeholder="Course" required>
      <button type="submit">Save Student</button>
      <button type="button" onclick="resetForm()">Clear</button>
    </form>
  </div>
  <div class="card">
    <h2>Student Records</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Course</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <script>
    const endpoint = "students";
    async function loadStudents() {
      const res = await fetch(endpoint);
      const data = await res.json();
      const rows = document.getElementById("rows"); rows.innerHTML = "";
      data.forEach(s => {
        const tr = document.createElement("tr");
        [s.id, s.name, s.email, s.course].forEach(v => { const td = document.createElement("td"); td.textContent = v; tr.appendChild(td); });
        const td = document.createElement("td");
        const edit = document.createElement("button"); edit.textContent = "Edit"; edit.onclick = () => editStudent(s);
        const del = document.createElement("button"); del.textContent = "Delete"; del.className = "delete"; del.onclick = () => deleteStudent(s.id);
        td.append(edit, del); tr.appendChild(td); rows.appendChild(tr);
      });
    }
    document.getElementById("studentForm").addEventListener("submit", async e => {
      e.preventDefault();
      const id = document.getElementById("id").value;
      const data = new URLSearchParams({ action: id ? "update" : "add", id, name: document.getElementById("name").value, email: document.getElementById("email").value, course: document.getElementById("course").value });
      const res = await fetch(endpoint, { method: "POST", body: data });
      if (!res.ok) { alert(await res.text()); return; }
      resetForm(); loadStudents();
    });
    function editStudent(s) {
      document.getElementById("id").value = s.id;
      document.getElementById("name").value = s.name;
      document.getElementById("email").value = s.email;
      document.getElementById("course").value = s.course;
      document.getElementById("formTitle").textContent = "Update Student";
    }
    function resetForm() { document.getElementById("studentForm").reset(); document.getElementById("id").value = ""; document.getElementById("formTitle").textContent = "Add Student"; }
    async function deleteStudent(id) {
      if (!confirm("Delete this student?")) return;
      const res = await fetch(endpoint + "?id=" + id, { method: "DELETE" });
      if (!res.ok) { alert(await res.text()); return; } loadStudents();
    }
    loadStudents();
  </script>
</body>

</html>
